name: Deploy Project

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/day20-cicd
            git pull origin main
            sudo docker build -t day20-app .
            sudo docker rm -f day20-container || true
            sudo docker run -d -p 80:80 --name day20-container day20-app
